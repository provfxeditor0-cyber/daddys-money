<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZILLA 4 PANEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg:     #05060a;
  --s1:     #0a0c12;
  --s2:     #0f1118;
  --s3:     #141720;
  --border: rgba(255,255,255,0.06);
  --b2:     rgba(255,255,255,0.1);
  --cyan:   #22d3ee;
  --cyan2:  #67e8f9;
  --cg:     rgba(34,211,238,0.12);
  --red:    #ef4444;
  --yellow: #fde68a;
  --blue:   #93c5fd;
  --t1:  #e8eaf0;
  --t2:  rgba(232,234,240,0.55);
  --t3:  rgba(232,234,240,0.28);
  --t4:  rgba(232,234,240,0.10);
  --mono:    'Share Tech Mono', monospace;
  --orb:     'Orbitron', sans-serif;
  --grotesk: 'Space Grotesk', sans-serif;
}
*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; overflow:hidden; }
body {
  background: var(--bg);
  color: var(--t1);
  font-family: var(--grotesk);
  display:flex; align-items:center; justify-content:center;
  position:relative;
}
body::before {
  content:'';
  position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(34,211,238,0.025) 1px, transparent 1px),
    linear-gradient(90deg, rgba(34,211,238,0.025) 1px, transparent 1px);
  background-size: 44px 44px;
  mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 20%, transparent 100%);
  pointer-events:none; z-index:0;
}
body::after {
  content:'';
  position:fixed; inset:0;
  background: radial-gradient(ellipse 110% 110% at 50% 50%, transparent 30%, rgba(5,6,10,0.92) 100%);
  pointer-events:none; z-index:0;
}
.scanlines {
  position:fixed; inset:0; z-index:1; pointer-events:none;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.05) 2px, rgba(0,0,0,0.05) 4px);
}

/* ── PAGES ── */
.page { display:none; width:100%; height:100%; position:fixed; inset:0; align-items:center; justify-content:center; z-index:10; }
.page.active { display:flex; }

/* ══════════════════════════
   LOGIN PAGE
══════════════════════════ */
#loginPage { flex-direction:column; align-items:center; }

.scan-bar {
  position:absolute; top:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity:0.45;
  animation: scanMove 5s linear infinite;
}
@keyframes scanMove { 0%{top:0;opacity:0;} 5%{opacity:0.45;} 95%{opacity:0.45;} 100%{top:100%;opacity:0;} }

.corner { position:absolute; width:48px; height:48px; }
.corner svg { width:48px; height:48px; }
.corner.tl { top:22px; left:22px; }
.corner.tr { top:22px; right:22px; transform:scaleX(-1); }
.corner.bl { bottom:22px; left:22px; transform:scaleY(-1); }
.corner.br { bottom:22px; right:22px; transform:scale(-1,-1); }
.corner svg path { stroke:rgba(34,211,238,0.22); fill:none; stroke-width:1.5; stroke-linecap:square; }

.login-wrap {
  position:relative; z-index:2;
  display:flex; flex-direction:column; align-items:center;
  animation: fadeIn 0.8s ease both;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(18px);} to{opacity:1;transform:translateY(0);} }

/* AVATAR */
.avatar-ring {
  position:relative; width:160px; height:160px; margin-bottom:26px;
}
.avatar-ring::before, .avatar-ring::after {
  content:''; position:absolute; border-radius:50%;
  border:1px solid rgba(34,211,238,0.2);
  animation:ringPulse 3s ease-in-out infinite;
}
.avatar-ring::before { inset:-7px; animation-delay:0s; }
.avatar-ring::after  { inset:-16px; opacity:0.5; animation-delay:0.7s; }
@keyframes ringPulse { 0%,100%{transform:scale(1);opacity:0.5;} 50%{transform:scale(1.03);opacity:1;} }

.avatar-tick { position:absolute; width:12px; height:12px; border-color:var(--cyan); border-style:solid; opacity:0.6; }
.avatar-tick.tl { top:-3px;left:-3px;border-width:2px 0 0 2px; }
.avatar-tick.tr { top:-3px;right:-3px;border-width:2px 2px 0 0; }
.avatar-tick.bl { bottom:-3px;left:-3px;border-width:0 0 2px 2px; }
.avatar-tick.br { bottom:-3px;right:-3px;border-width:0 2px 2px 0; }

.avatar-img {
  width:160px; height:160px; border-radius:50%; display:block;
  border:2px solid rgba(34,211,238,0.28);
  background:var(--s2);
}

.login-brand {
  font-family:var(--mono); font-size:9px; letter-spacing:3.5px;
  color:var(--t4); text-transform:uppercase; margin-bottom:10px;
}
.login-title {
  font-family:var(--orb); font-size:clamp(18px,3.5vw,26px); font-weight:800;
  letter-spacing:3px; color:var(--t1); text-align:center;
  margin-bottom:5px; text-transform:uppercase; line-height:1.3;
}
.login-title span { color:var(--cyan); }
.login-sub {
  font-family:var(--mono); font-size:10px; letter-spacing:2px;
  color:var(--t4); text-transform:uppercase; margin-bottom:36px;
}

.key-wrap { position:relative; width:310px; margin-bottom:10px; }
.key-label {
  font-family:var(--mono); font-size:9px; letter-spacing:2px;
  color:var(--t4); text-transform:uppercase; margin-bottom:8px; display:block;
  transition:color 0.2s;
}
.key-wrap:focus-within .key-label { color:var(--cyan); }
.key-input-wrap { position:relative; display:flex; align-items:center; }
.key-bracket {
  font-family:var(--mono); font-size:22px; color:rgba(34,211,238,0.25);
  padding:0 10px; line-height:1; flex-shrink:0; transition:color 0.2s;
  user-select:none;
}
.key-wrap:focus-within .key-bracket { color:rgba(34,211,238,0.6); }
.key-input {
  flex:1; height:50px;
  background:var(--s2); border:1px solid var(--border); border-left:none; border-right:none;
  color:var(--cyan2); font-family:var(--mono); font-size:15px; letter-spacing:2px;
  text-align:center; outline:none;
  transition:border-color 0.25s, background 0.25s, box-shadow 0.25s;
  padding:0 8px;
}
.key-input::placeholder { color:var(--t4); letter-spacing:2px; }
.key-input:focus { background:rgba(34,211,238,0.03); box-shadow:0 0 0 1px rgba(34,211,238,0.18) inset, 0 0 20px rgba(34,211,238,0.05); }
.key-input.error { color:var(--red); animation:shake 0.38s ease; }
@keyframes shake { 0%,100%{transform:translateX(0);} 20%{transform:translateX(-6px);} 40%{transform:translateX(6px);} 60%{transform:translateX(-4px);} 80%{transform:translateX(4px);} }

.err-msg {
  font-family:var(--mono); font-size:10px; color:var(--red);
  letter-spacing:1.5px; text-align:center; min-height:16px; margin-bottom:18px;
  opacity:0; transition:opacity 0.2s;
}
.err-msg.show { opacity:1; }

.enter-btn {
  width:310px; height:48px;
  background:transparent; border:1px solid rgba(34,211,238,0.32);
  color:var(--cyan); font-family:var(--orb); font-size:13px; font-weight:700;
  letter-spacing:5px; text-transform:uppercase; cursor:pointer;
  position:relative; overflow:hidden; transition:all 0.2s ease;
}
.enter-btn::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg,transparent,rgba(34,211,238,0.07),transparent);
  transform:translateX(-100%); transition:transform 0.55s ease;
}
.enter-btn:hover { background:rgba(34,211,238,0.05); border-color:rgba(34,211,238,0.55); box-shadow:0 0 18px rgba(34,211,238,0.08); }
.enter-btn:hover::before { transform:translateX(100%); }
.enter-btn:active { transform:scale(0.98); }

.status-bar {
  position:absolute; bottom:20px; left:50%; transform:translateX(-50%);
  display:flex; align-items:center; gap:14px;
  font-family:var(--mono); font-size:9px; letter-spacing:2px; color:var(--t4); white-space:nowrap;
}
.status-dot { width:5px; height:5px; border-radius:50%; background:var(--cyan); opacity:0.5; animation:dotBlink 2s ease-in-out infinite; }
@keyframes dotBlink { 0%,100%{opacity:0.25;} 50%{opacity:0.7;} }

/* ══════════════════════════
   PANEL PAGE
══════════════════════════ */
#panelPage { flex-direction:column; align-items:center; justify-content:flex-start; overflow:hidden; }

/* ── HEADER ── */
.panel-header {
  width:100%; height:56px;
  border-bottom:1px solid var(--border);
  background:rgba(10,12,18,0.92);
  backdrop-filter:blur(16px);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 24px; flex-shrink:0; position:relative; z-index:5;
}
.ph-logo { font-family:var(--orb); font-size:13px; font-weight:800; letter-spacing:4px; color:var(--t2); }
.ph-logo span { color:var(--cyan); }
.ph-right { display:flex; align-items:center; gap:24px; }

/* period */
.period-wrap { display:flex; flex-direction:column; align-items:flex-end; gap:2px; }
.period-label { font-family:var(--mono); font-size:8px; letter-spacing:2px; color:var(--t4); text-transform:uppercase; }
.period-val { font-family:var(--mono); font-size:11px; color:var(--t3); letter-spacing:0.5px; }

/* ── WATCH TIMER ── */
.watch-wrap {
  display:flex; flex-direction:column; align-items:center; gap:1px;
}
.watch-label { font-family:var(--mono); font-size:8px; letter-spacing:2px; color:var(--t4); text-transform:uppercase; }

.watch-face {
  position:relative;
  width:64px; height:64px;
  flex-shrink:0;
}
.watch-svg { width:64px; height:64px; transform:rotate(-90deg); }
.watch-track { fill:none; stroke:rgba(255,255,255,0.06); stroke-width:3; }
.watch-prog  { fill:none; stroke:var(--cyan); stroke-width:3; stroke-linecap:round;
  stroke-dasharray:163; stroke-dashoffset:0;
  transition:stroke-dashoffset 0.9s linear, stroke 0.4s;
  filter:drop-shadow(0 0 4px rgba(34,211,238,0.4));
}
.watch-prog.warn { stroke:#f59e0b; filter:drop-shadow(0 0 4px rgba(245,158,11,0.4)); }
.watch-prog.crit { stroke:var(--red); filter:drop-shadow(0 0 5px rgba(239,68,68,0.5)); animation:progFlash 0.5s ease-in-out infinite; }
@keyframes progFlash { 50%{ opacity:0.4; } }

.watch-center-text {
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  font-family:var(--orb); font-size:13px; font-weight:700; letter-spacing:1px;
  color:var(--cyan); line-height:1;
  transition:color 0.4s;
}
.watch-center-text.warn { color:#f59e0b; }
.watch-center-text.crit { color:var(--red); }

/* ── CENTER AREA ── */
.panel-center {
  flex:1; display:flex; flex-direction:column;
  align-items:center; justify-content:center;
  position:relative; z-index:2; width:100%; overflow:hidden;
}

/* result circle */
.result-circle-wrap {
  position:relative; display:flex; align-items:center; justify-content:center;
}

.result-circle {
  width:220px; height:220px; border-radius:50%;
  border:2px solid rgba(255,255,255,0.06);
  background: radial-gradient(circle, rgba(20,23,32,0.9) 0%, rgba(10,12,18,0.95) 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  position:relative; overflow:hidden;
  box-shadow: 0 0 0 1px rgba(255,255,255,0.04), inset 0 0 40px rgba(0,0,0,0.4);
  transition: box-shadow 0.5s ease, border-color 0.5s;
}

/* spinning ring on circle */
.ring-spin {
  position:absolute; inset:-2px;
  border-radius:50%;
  border:2px solid transparent;
  border-top-color:rgba(34,211,238,0.25);
  border-right-color:rgba(34,211,238,0.1);
  animation:spin 6s linear infinite;
  pointer-events:none;
}
@keyframes spin { to { transform:rotate(360deg); } }

.result-inner-label {
  font-family:var(--mono); font-size:9px; letter-spacing:3px;
  text-transform:uppercase; color:var(--t4); margin-bottom:8px;
  transition:color 0.4s;
}
.result-main-text {
  font-family:var(--orb); font-size:42px; font-weight:900;
  letter-spacing:4px; text-transform:uppercase;
  color:var(--t4); transition:color 0.4s, text-shadow 0.4s, font-size 0.3s;
  line-height:1;
}
.result-sub-text {
  font-family:var(--mono); font-size:10px; letter-spacing:2px;
  color:var(--t4); margin-top:10px; text-transform:uppercase;
  transition:color 0.4s; min-height:14px;
}

/* states */
.result-circle.show-small {
  border-color:rgba(253,230,138,0.3);
  box-shadow:0 0 40px rgba(253,230,138,0.1), 0 0 80px rgba(253,230,138,0.04), inset 0 0 40px rgba(253,230,138,0.04);
}
.result-circle.show-small .result-inner-label { color:rgba(253,230,138,0.5); }
.result-circle.show-small .result-main-text { color:var(--yellow); text-shadow:0 0 30px rgba(253,230,138,0.5), 0 0 60px rgba(253,230,138,0.2); font-size:52px; }
.result-circle.show-small .result-sub-text  { color:rgba(253,230,138,0.45); }

.result-circle.show-big {
  border-color:rgba(147,197,253,0.3);
  box-shadow:0 0 40px rgba(147,197,253,0.12), 0 0 80px rgba(147,197,253,0.05), inset 0 0 40px rgba(147,197,253,0.05);
}
.result-circle.show-big .result-inner-label { color:rgba(147,197,253,0.5); }
.result-circle.show-big .result-main-text { color:var(--blue); text-shadow:0 0 30px rgba(147,197,253,0.5), 0 0 60px rgba(147,197,253,0.2); font-size:64px; }
.result-circle.show-big .result-sub-text  { color:rgba(147,197,253,0.45); }

/* crosshair corners on circle */
.circ-corner { position:absolute; width:14px; height:14px; }
.circ-corner::before, .circ-corner::after { content:''; position:absolute; background:rgba(34,211,238,0.25); }
.circ-corner.c-tl { top:14px;left:14px; }
.circ-corner.c-tr { top:14px;right:14px; }
.circ-corner.c-bl { bottom:14px;left:14px; }
.circ-corner.c-br { bottom:14px;right:14px; }
.circ-corner.c-tl::before,.circ-corner.c-tr::before,.circ-corner.c-bl::before,.circ-corner.c-br::before { width:100%;height:1px;top:0;left:0; }
.circ-corner.c-tl::after,.circ-corner.c-tr::after,.circ-corner.c-bl::after,.circ-corner.c-br::after { height:100%;width:1px;top:0;left:0; }

/* ── FOOTER ── */
.panel-footer {
  width:100%; padding:0 24px 32px;
  display:flex; flex-direction:column; align-items:center; gap:10px;
  flex-shrink:0; position:relative; z-index:5;
}

.generate-btn {
  width:100%; max-width:280px; height:50px;
  background:transparent;
  border:1px solid rgba(34,211,238,0.3);
  color:var(--cyan);
  font-family:var(--orb); font-size:14px; font-weight:700; letter-spacing:5px;
  text-transform:uppercase; cursor:pointer;
  position:relative; overflow:hidden;
  transition:all 0.22s ease;
}
.generate-btn::before {
  content:''; position:absolute; inset:0;
  background:linear-gradient(90deg, transparent, rgba(34,211,238,0.07), transparent);
  transform:translateX(-100%); transition:transform 0.5s;
}
.generate-btn:hover { background:rgba(34,211,238,0.05); border-color:rgba(34,211,238,0.55); box-shadow:0 0 20px rgba(34,211,238,0.1); }
.generate-btn:hover::before { transform:translateX(100%); }
.generate-btn:active { transform:scale(0.97); }
.generate-btn:disabled { opacity:0.25; cursor:not-allowed; transform:none !important; box-shadow:none; border-color: rgba(239,68,68,0.3); color: var(--red); }

.footer-status {
  font-family:var(--mono); font-size:9px; letter-spacing:2px;
  color:var(--t4); text-transform:uppercase; text-align:center; min-height:13px;
  transition:color 0.3s;
}
.footer-status.locked { color:rgba(239,68,68,0.6); }

/* flash */
.flash-overlay { position:fixed;inset:0;z-index:999;background:var(--cyan);opacity:0;pointer-events:none; }
.flash-overlay.go { animation:flashAnim 0.4s ease forwards; }
@keyframes flashAnim { 0%{opacity:0.3;} 100%{opacity:0;} }
</style>
</head>
<body>

<div class="scanlines"></div>
<div class="flash-overlay" id="flashOverlay"></div>

<div class="page active" id="loginPage">
  <div class="scan-bar"></div>
  <div class="corner tl"><svg viewBox="0 0 48 48"><path d="M2 46 L2 2 L46 2"/></svg></div>
  <div class="corner tr"><svg viewBox="0 0 48 48"><path d="M2 46 L2 2 L46 2"/></svg></div>
  <div class="corner bl"><svg viewBox="0 0 48 48"><path d="M2 46 L2 2 L46 2"/></svg></div>
  <div class="corner br"><svg viewBox="0 0 48 48"><path d="M2 46 L2 2 L46 2"/></svg></div>

  <div class="login-wrap">
    <div class="avatar-ring">
      <div class="avatar-tick tl"></div>
      <div class="avatar-tick tr"></div>
      <div class="avatar-tick bl"></div>
      <div class="avatar-tick br"></div>
      <img class="avatar-img"
           src="https://api.dicebear.com/10.x/toon-head/svg?seed=Felix"
           alt="avatar"
           onerror="this.style.background='#0f1118'">
    </div>

    <div class="login-brand">Secure Access Terminal</div>
    <div class="login-title">WELCOME TO <span>ZILLA</span> 4 PANEL</div>
    <div class="login-sub">Authorized Personnel Only</div>

    <div class="key-wrap">
      <label class="key-label">Enter Your Key</label>
      <div class="key-input-wrap">
        <span class="key-bracket">[</span>
        <input class="key-input" id="keyInput" type="password" placeholder="••••••••••••••" autocomplete="off">
        <span class="key-bracket">]</span>
      </div>
    </div>
    <div class="err-msg" id="errMsg">INVALID KEY — ACCESS DENIED</div>
    <button class="enter-btn" id="enterBtn">ENTER</button>
  </div>

  <div class="status-bar">
    <div class="status-dot"></div>
    <span>ZILLA4 &nbsp;|&nbsp; SECURE CHANNEL &nbsp;|&nbsp; v4.0.1</span>
  </div>
</div>

<div class="page" id="panelPage">
  <div class="panel-header">
    <div class="ph-logo">ZILLA <span>4</span> PANEL</div>
    <div class="ph-right">
      <div class="period-wrap">
        <span class="period-label">Period</span>
        <span class="period-val" id="periodVal">20260615100010418</span>
      </div>
      <div class="watch-wrap">
        <span class="watch-label">Timer</span>
        <div class="watch-face">
          <svg class="watch-svg" viewBox="0 0 56 56">
            <circle class="watch-track" cx="28" cy="28" r="26"/>
            <circle class="watch-prog"  cx="28" cy="28" r="26" id="watchProg"/>
          </svg>
          <div class="watch-center-text" id="watchText">00:59</div>
        </div>
      </div>
    </div>
  </div>

  <div class="panel-center">
    <div class="result-circle-wrap">
      <div class="result-circle" id="resultCircle">
        <div class="ring-spin"></div>
        <div class="circ-corner c-tl"></div>
        <div class="circ-corner c-tr"></div>
        <div class="circ-corner c-bl"></div>
        <div class="circ-corner c-br"></div>
        <div class="result-inner-label" id="resultLabel">RESULT</div>
        <div class="result-main-text"   id="resultMain">—</div>
        <div class="result-sub-text"    id="resultSub">Click Generate</div>
      </div>
    </div>
  </div>

  <div class="panel-footer">
    <button class="generate-btn" id="generateBtn">GENERATE</button>
    <div class="footer-status" id="footerStatus">SELECT RESULT TO DISPLAY</div>
  </div>
</div>

<script>
/* ─── LOGIN ─── */
const CORRECT_KEY = 'MONU MANFORCE';

const keyInput = document.getElementById('keyInput');
const enterBtn = document.getElementById('enterBtn');
const errMsg   = document.getElementById('errMsg');

function tryLogin() {
  if (keyInput.value.trim() === CORRECT_KEY) {
    const fl = document.getElementById('flashOverlay');
    fl.classList.add('go');
    setTimeout(() => {
      document.getElementById('loginPage').classList.remove('active');
      document.getElementById('panelPage').classList.add('active');
      startTimer();
    }, 200);
  } else {
    keyInput.classList.add('error');
    errMsg.classList.add('show');
    setTimeout(() => keyInput.classList.remove('error'), 420);
  }
}
enterBtn.addEventListener('click', tryLogin);
keyInput.addEventListener('keydown', e => { if (e.key === 'Enter') tryLogin(); });
keyInput.addEventListener('input',   () => errMsg.classList.remove('show'));

/* ─── REAL-TIME TIME-STAMP TIMER SYSTEM (1-MIN / 60S GAME) ─── */
const GAME_SPEED_SECS = 60; 
const CIRCUM = 2 * Math.PI * 26;

// Precise static anchor point linked to the requested baseline layout
const START_TIMESTAMP = Date.parse('2026-06-15T12:27:00'); 
const BASE_PERIOD_NUM = 20260615100010418n;

let timeLeft = 0;
let timerInt = null;
let hasGeneratedThisRound = false;
let currentActivePeriod = "";

const watchProg   = document.getElementById('watchProg');
const watchText   = document.getElementById('watchText');
const periodVal   = document.getElementById('periodVal');
const generateBtn = document.getElementById('generateBtn');
const footerStatus= document.getElementById('footerStatus');
const resultCircle= document.getElementById('resultCircle');
const resultLabel = document.getElementById('resultLabel');
const resultMain  = document.getElementById('resultMain');
const resultSub   = document.getElementById('resultSub');

watchProg.style.strokeDasharray = CIRCUM;

function updateRealTimeEngine() {
  const nowMs = Date.now();
  
  // 1. Live minutes calculated straight from standard reference anchor point
  const elapsedMs = nowMs - START_TIMESTAMP;
  const elapsedCycles = elapsedMs > 0 ? Math.floor(elapsedMs / (GAME_SPEED_SECS * 1000)) : 0;
  
  // 2. Absolute synced live loop period sequence engine
  const calculatedPeriod = BASE_PERIOD_NUM + BigInt(elapsedCycles);
  
  if (currentActivePeriod !== calculatedPeriod.toString()) {
    currentActivePeriod = calculatedPeriod.toString();
    periodVal.textContent = currentActivePeriod;
    // Round changes! Unlock only the button for the new period
    resetRound();
  }

  // 3. Perfect continuous countdown tracker from 00:59 down to 00:00
  const currentSeconds = new Date().getSeconds();
  timeLeft = 59 - currentSeconds;

  // Render SVG circular border fill tracking progress
  const pct = timeLeft / 59;
  watchProg.style.strokeDashoffset = CIRCUM * (1 - pct);

  const m = "00";
  const s = timeLeft.toString().padStart(2, '0');
  watchText.textContent = `${m}:${s}`;

  // Color changing status indicator states based on remaining clock frames
  watchProg.className = 'watch-prog';
  watchText.className = 'watch-center-text';
  if (timeLeft <= 10) {
    watchProg.classList.add('crit');
    watchText.classList.add('crit');
  } else if (timeLeft <= 20) {
    watchProg.classList.add('warn');
    watchText.classList.add('warn');
  }
}

function resetRound() {
  hasGeneratedThisRound = false;
  generateBtn.disabled = false;
  footerStatus.className = 'footer-status';
  footerStatus.textContent = 'SELECT RESULT TO DISPLAY';
}

function startTimer() {
  updateRealTimeEngine();
  timerInt = setInterval(updateRealTimeEngine, 1000);
}

/* ─── GENERATE RESULT (ONLY BIG & SMALL) ─── */
generateBtn.addEventListener('click', () => {
  if (hasGeneratedThisRound) return;

  hasGeneratedThisRound = true;
  generateBtn.disabled = true; // Locks button instantly until new period triggers
  footerStatus.className = 'footer-status locked';
  footerStatus.textContent = 'LOCKED — WAIT FOR NEXT PERIOD';

  // Completely random 50/50 balance split sequence logic
  const isBig = Math.random() < 0.5;
  const size  = isBig ? 'big' : 'small';

  // Smooth CSS scale transform animation
  resultCircle.style.transform = 'scale(0.96)';
  setTimeout(() => {
    resultCircle.style.transition = 'transform 0.35s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.5s, border-color 0.5s';
    resultCircle.style.transform = 'scale(1)';

    // Reset current classes safely
    resultCircle.className = 'result-circle';
    
    // Inject active stylized layout states immediately
    resultCircle.classList.add('show-' + size);
    resultLabel.textContent = size === 'small' ? 'RESULT · SMALL' : 'RESULT · BIG';
    resultMain.textContent  = size.toUpperCase();
    resultSub.textContent   = size === 'small' ? 'Light Yellow' : 'Light Blue';
  }, 160);
});
</script>
