<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Village Code Validator</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }
        
        .container {
            width: 100%;
            max-width: 500px;
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            transition: transform 0.3s ease;
        }
        
        .container.data-updating {
            animation: pulse 0.5s ease;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        
        .header {
            background: linear-gradient(to right, #0f3460, #1a1a2e);
            color: white;
            padding: 25px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h1 {
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        
        .coin-display {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 18px;
            backdrop-filter: blur(5px);
        }
        
        .coin-display i {
            color: gold;
            font-size: 22px;
        }
        
        .content {
            padding: 30px;
        }
        
        .target-data {
            background: linear-gradient(135deg, #0f3460 0%, #1a1a2e 100%);
            color: white;
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 25px;
            border: 2px solid #e94560;
            text-align: center;
            user-select: none;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            transition: all 0.3s ease;
        }
        
        .target-data.data-changing {
            background: linear-gradient(135deg, #e94560 0%, #ff6b8b 100%);
            animation: dataChange 0.5s ease;
        }
        
        @keyframes dataChange {
            0% { opacity: 1; transform: translateY(0); }
            50% { opacity: 0.5; transform: translateY(-10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        
        .target-data h3 {
            margin-bottom: 20px;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            color: #e94560;
        }
        
        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        
        .data-item:last-child {
            border-bottom: none;
        }
        
        .data-label {
            font-weight: 600;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #b8b8d1;
        }
        
        .data-value {
            font-weight: 700;
            font-size: 18px;
            color: #fff;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }
        
        .form-container {
            background-color: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .form-group {
            margin-bottom: 25px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background-color: #fff;
        }
        
        .form-group input:focus {
            border-color: #0f3460;
            outline: none;
            box-shadow: 0 0 0 3px rgba(15, 52, 96, 0.1);
            background-color: #fff;
        }
        
        .check-btn {
            background: linear-gradient(to right, #0f3460, #1a1a2e);
            color: white;
            border: none;
            padding: 16px 30px;
            font-size: 18px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s;
            margin-top: 10px;
            letter-spacing: 0.5px;
        }
        
        .check-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(15, 52, 96, 0.3);
        }
        
        /* Results Modal Styles */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .results-modal {
            background-color: white;
            border-radius: 15px;
            width: 100%;
            max-width: 500px;
            max-height: 90vh;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            animation: modalAppear 0.3s ease-out;
        }
        
        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: translateY(-30px) scale(0.95);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }
        
        .modal-header {
            background: linear-gradient(to right, #0f3460, #1a1a2e);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .modal-header h2 {
            font-size: 22px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .close-modal {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s;
        }
        
        .close-modal:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }
        
        .modal-content {
            padding: 25px;
            overflow-y: auto;
            max-height: calc(90vh - 80px);
        }
        
        .result-status {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        
        .success {
            color: #28a745;
            background-color: rgba(40, 167, 69, 0.1);
            border: 2px solid #28a745;
        }
        
        .error {
            color: #dc3545;
            background-color: rgba(220, 53, 69, 0.1);
            border: 2px solid #dc3545;
        }
        
        .comparison-container {
            margin: 25px 0;
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            border: 1px solid #e9ecef;
        }
        
        .comparison-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #0f3460;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .comparison-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
            border-bottom: 1px solid #dee2e6;
        }
        
        .comparison-row:last-child {
            border-bottom: none;
        }
        
        .field-name {
            font-weight: 600;
            color: #495057;
            width: 30%;
        }
        
        .user-value {
            width: 30%;
            text-align: center;
            padding: 5px 10px;
            background-color: #e9ecef;
            border-radius: 5px;
            font-weight: 500;
        }
        
        .target-value {
            width: 30%;
            text-align: center;
            padding: 5px 10px;
            background-color: #f1f3f5;
            border-radius: 5px;
            font-weight: 500;
        }
        
        .match-indicator {
            width: 10%;
            text-align: center;
            font-size: 20px;
        }
        
        .match-yes {
            color: #28a745;
        }
        
        .match-no {
            color: #dc3545;
        }
        
        .coins-info {
            background: linear-gradient(135deg, #fff9db, #ffe066);
            border-radius: 10px;
            padding: 20px;
            margin: 25px 0;
            text-align: center;
            border: 2px solid #ffd43b;
        }
        
        .coins-info i {
            color: #e67700;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .coins-text {
            font-size: 20px;
            font-weight: 700;
            color: #e67700;
        }
        
        .modal-actions {
            display: flex;
            gap: 15px;
            margin-top: 25px;
        }
        
        .modal-btn {
            flex: 1;
            padding: 16px;
            border: none;
            border-radius: 10px;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .modal-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 7px 15px rgba(0, 0, 0, 0.2);
        }
        
        .claim-btn {
            background: linear-gradient(to right, #e94560, #ff6b8b);
            color: white;
        }
        
        .new-data-btn {
            background: linear-gradient(to right, #0f3460, #1a1a2e);
            color: white;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 22px;
            }
            
            .data-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 5px;
            }
            
            .data-value {
                font-size: 16px;
            }
            
            .modal-actions {
                flex-direction: column;
            }
            
            .comparison-row {
                flex-wrap: wrap;
                gap: 10px;
            }
            
            .field-name, .user-value, .target-value {
                width: 100%;
                text-align: left;
            }
            
            .match-indicator {
                width: 100%;
                text-align: left;
            }
        }
        
        @media (max-width: 480px) {
            .content {
                padding: 20px;
            }
            
            .target-data, .form-container {
                padding: 20px;
            }
            
            .modal-content {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container" id="main-container">
        <div class="header">
            <h1><i class="fas fa-home"></i> Village Code Validator</h1>
            <div class="coin-display">
                <i class="fas fa-coins"></i>
                <span id="coins-count">100</span> Coins
            </div>
        </div>
        
        <div class="content">
            <div class="target-data" id="target-data">
                <h3><i class="fas fa-bullseye"></i> Replicate This Data</h3>
                <div class="data-item">
                    <div class="data-label">
                        <i class="fas fa-user"></i> Name:
                    </div>
                    <div class="data-value" id="target-name">Ava Lee</div>
                </div>
                <div class="data-item">
                    <div class="data-label">
                        <i class="fas fa-home"></i> Village:
                    </div>
                    <div class="data-value" id="target-village">Graffelfree</div>
                </div>
                <div class="data-item">
                    <div class="data-label">
                        <i class="fas fa-key"></i> Code:
                    </div>
                    <div class="data-value" id="target-code">O5535</div>
                </div>
            </div>
            
            <div class="form-container">
                <div class="form-group">
                    <label for="name"><i class="fas fa-user"></i> Enter Name and Surname</label>
                    <input type="text" id="name" placeholder="Type the name shown above" autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="village"><i class="fas fa-home"></i> Enter Village Name</label>
                    <input type="text" id="village" placeholder="Type the village shown above" autocomplete="off">
                </div>
                
                <div class="form-group">
                    <label for="code"><i class="fas fa-key"></i> Enter Code (Letter + 4 Numbers)</label>
                    <input type="text" id="code" placeholder="Type the code shown above" autocomplete="off">
                </div>
                
                <button class="check-btn" id="check-btn">
                    <i class="fas fa-check-circle"></i> Check Match
                </button>
            </div>
        </div>
    </div>

    <!-- Results Modal -->
    <div class="modal-overlay" id="results-modal">
        <div class="results-modal">
            <div class="modal-header">
                <h2><i class="fas fa-poll"></i> Validation Results</h2>
                <button class="close-modal" id="close-modal">&times;</button>
            </div>
            
            <div class="modal-content">
                <div class="result-status" id="result-status">
                    Checking your entries...
                </div>
                
                <div class="comparison-container">
                    <div class="comparison-title">
                        <i class="fas fa-exchange-alt"></i> Entry Comparison
                    </div>
                    
                    <div class="comparison-row">
                        <div class="field-name">Name:</div>
                        <div class="user-value" id="user-name-display">-</div>
                        <div class="target-value" id="target-name-display">-</div>
                        <div class="match-indicator" id="name-match">-</div>
                    </div>
                    
                    <div class="comparison-row">
                        <div class="field-name">Village:</div>
                        <div class="user-value" id="user-village-display">-</div>
                        <div class="target-value" id="target-village-display">-</div>
                        <div class="match-indicator" id="village-match">-</div>
                    </div>
                    
                    <div class="comparison-row">
                        <div class="field-name">Code:</div>
                        <div class="user-value" id="user-code-display">-</div>
                        <div class="target-value" id="target-code-display">-</div>
                        <div class="match-indicator" id="code-match">-</div>
                    </div>
                </div>
                
                <div class="coins-info" id="coins-info">
                    <i class="fas fa-coins"></i>
                    <div class="coins-text" id="coins-text">You can earn 25 coins!</div>
                </div>
                
                <div class="modal-actions">
                    <button class="modal-btn claim-btn" id="claim-btn">
                        <i class="fas fa-gift"></i> Claim 25 Coins
                    </button>
                    <button class="modal-btn new-data-btn" id="new-data-btn">
                        <i class="fas fa-redo"></i> Try New Data
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Arrays for generating random data
        const firstNames = [
            "Ava", "Emma", "Sophia", "Olivia", "Isabella", "Mia", "Charlotte", "Amelia",
            "Harper", "Evelyn", "Abigail", "Emily", "Elizabeth", "Mila", "Ella", "Scarlett",
            "Grace", "Chloe", "Victoria", "Riley", "Aria", "Lily", "Aurora", "Zoey"
        ];
        
        const lastNames = [
            "Lee", "Smith", "Johnson", "Williams", "Brown", "Jones", "Garcia", "Miller",
            "Davis", "Rodriguez", "Martinez", "Hernandez", "Lopez", "Gonzalez", "Wilson",
            "Anderson", "Thomas", "Taylor", "Moore", "Jackson", "Martin", "Thompson", "White"
        ];
        
        const fakeVillages = [
            "Graffelfree", "Zorblaxia", "Quibbleton", "Fizzletown", "Glimmerfall", 
            "Snickerdoodle", "Wobbleburg", "Jabberwock", "Flibbertown", "Zizzleville", 
            "Quirkville", "Bumbleburg", "Noodleham", "Puddlewick", "Frogsbottom"
        ];
        
        // DOM Elements
        const nameInput = document.getElementById('name');
        const villageInput = document.getElementById('village');
        const codeInput = document.getElementById('code');
        const checkBtn = document.getElementById('check-btn');
        const claimBtn = document.getElementById('claim-btn');
        const newDataBtn = document.getElementById('new-data-btn');
        const closeModalBtn = document.getElementById('close-modal');
        const resultsModal = document.getElementById('results-modal');
        const resultStatus = document.getElementById('result-status');
        const coinsCount = document.getElementById('coins-count');
        const targetDataElement = document.getElementById('target-data');
        const mainContainer = document.getElementById('main-container');
        
        // Target data elements
        const targetNameElement = document.getElementById('target-name');
        const targetVillageElement = document.getElementById('target-village');
        const targetCodeElement = document.getElementById('target-code');
        const targetData = document.getElementById('target-data');
        
        // Results display elements
        const userNameDisplay = document.getElementById('user-name-display');
        const userVillageDisplay = document.getElementById('user-village-display');
        const userCodeDisplay = document.getElementById('user-code-display');
        const targetNameDisplay = document.getElementById('target-name-display');
        const targetVillageDisplay = document.getElementById('target-village-display');
        const targetCodeDisplay = document.getElementById('target-code-display');
        const nameMatchIndicator = document.getElementById('name-match');
        const villageMatchIndicator = document.getElementById('village-match');
        const codeMatchIndicator = document.getElementById('code-match');
        const coinsText = document.getElementById('coins-text');
        const coinsInfo = document.getElementById('coins-info');
        
        // Current target data
        let targetName = '';
        let targetVillage = '';
        let targetCode = '';
        
        // Current coins from localStorage or default
        let coins = localStorage.getItem('villageCodeCoins') ? parseInt(localStorage.getItem('villageCodeCoins')) : 100;
        coinsCount.textContent = coins;
        
        // Function to generate random data
        function generateRandomData() {
            // Generate random name
            const randomFirstName = firstNames[Math.floor(Math.random() * firstNames.length)];
            const randomLastName = lastNames[Math.floor(Math.random() * lastNames.length)];
            targetName = `${randomFirstName} ${randomLastName}`;
            
            // Generate random village
            targetVillage = fakeVillages[Math.floor(Math.random() * fakeVillages.length)];
            
            // Generate random code (one letter + 4 numbers)
            const randomLetter = String.fromCharCode(65 + Math.floor(Math.random() * 26));
            const randomNumber = Math.floor(1000 + Math.random() * 9000);
            targetCode = `${randomLetter}${randomNumber}`;
            
            // Update display with animation
            targetDataElement.classList.add('data-changing');
            mainContainer.classList.add('data-updating');
            
            setTimeout(() => {
                targetNameElement.textContent = targetName;
                targetVillageElement.textContent = targetVillage;
                targetCodeElement.textContent = targetCode;
                
                targetDataElement.classList.remove('data-changing');
                mainContainer.classList.remove('data-updating');
            }, 300);
        }
        
        // Initialize with random data
        generateRandomData();
        
        // Copy protection - disable text selection and copying
        targetData.addEventListener('copy', function(e) {
            e.preventDefault();
            alert('Copying is not allowed! Please type the data manually.');
        });
        
        targetData.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            return false;
        });
        
        // Check button click event
        checkBtn.addEventListener('click', function() {
            // Get input values
            const name = nameInput.value.trim();
            const village = villageInput.value.trim();
            const code = codeInput.value.trim();
            
            // Update display in modal
            userNameDisplay.textContent = name || "(empty)";
            userVillageDisplay.textContent = village || "(empty)";
            userCodeDisplay.textContent = code || "(empty)";
            
            targetNameDisplay.textContent = targetName;
            targetVillageDisplay.textContent = targetVillage;
            targetCodeDisplay.textContent = targetCode;
            
            // Validate inputs
            let nameMatch = name === targetName;
            let villageMatch = village === targetVillage;
            let codeMatch = code === targetCode;
            
            let allMatch = nameMatch && villageMatch && codeMatch;
            
            // Update match indicators
            nameMatchIndicator.textContent = nameMatch ? "✓" : "✗";
            nameMatchIndicator.className = `match-indicator ${nameMatch ? 'match-yes' : 'match-no'}`;
            
            villageMatchIndicator.textContent = villageMatch ? "✓" : "✗";
            villageMatchIndicator.className = `match-indicator ${villageMatch ? 'match-yes' : 'match-no'}`;
            
            codeMatchIndicator.textContent = codeMatch ? "✓" : "✗";
            codeMatchIndicator.className = `match-indicator ${codeMatch ? 'match-yes' : 'match-no'}`;
            
            // Show appropriate result
            if (allMatch) {
                resultStatus.textContent = 'Perfect Match! All entries are correct!';
                resultStatus.className = 'result-status success';
                coinsText.innerHTML = 'You earned 25 coins!';
                coinsInfo.style.background = 'linear-gradient(135deg, #d4edda, #c3e6cb)';
                coinsInfo.style.borderColor = '#28a745';
                claimBtn.style.display = 'flex';
                newDataBtn.style.display = 'none';
            } else {
                resultStatus.textContent = 'Entries do not match';
                resultStatus.className = 'result-status error';
                coinsText.innerHTML = 'No coins earned this time';
                coinsInfo.style.background = 'linear-gradient(135deg, #f8d7da, #f5c6cb)';
                coinsInfo.style.borderColor = '#dc3545';
                claimBtn.style.display = 'none';
                newDataBtn.style.display = 'flex';
            }
            
            // Show the modal
            resultsModal.style.display = 'flex';
            document.body.style.overflow = 'hidden';
        });
        
        // Claim button click event
        claimBtn.addEventListener('click', function() {
            // Add 25 coins
            coins += 25;
            coinsCount.textContent = coins;
            localStorage.setItem('villageCodeCoins', coins);
            
            // Update result message
            resultStatus.textContent = 'Congratulations!';
            resultStatus.className = 'result-status success';
            coinsText.innerHTML = '25 coins added to your balance!';
            coinsInfo.style.background = 'linear-gradient(135deg, #fff9db, #ffe066)';
            coinsInfo.style.borderColor = '#ffd43b';
            claimBtn.style.display = 'none';
            newDataBtn.style.display = 'flex';
            
            // Close modal after 1.5 seconds
            setTimeout(() => {
                resultsModal.style.display = 'none';
                document.body.style.overflow = 'auto';
                
                // Generate new random data
                generateRandomData();
                
                // Clear input fields
                nameInput.value = '';
                villageInput.value = '';
                codeInput.value = '';
                
                // Focus on first input
                nameInput.focus();
            }, 1500);
        });
        
        // New data button click event (for failed attempts)
        newDataBtn.addEventListener('click', function() {
            // Generate new random data
            generateRandomData();
            
            // Clear input fields
            nameInput.value = '';
            villageInput.value = '';
            codeInput.value = '';
            
            // Close modal
            resultsModal.style.display = 'none';
            document.body.style.overflow = 'auto';
            
            // Focus on first input
            nameInput.focus();
        });
        
        // Close modal button
        closeModalBtn.addEventListener('click', function() {
            resultsModal.style.display = 'none';
            document.body.style.overflow = 'auto';
        });
        
        // Close modal when clicking outside
        resultsModal.addEventListener('click', function(e) {
            if (e.target === resultsModal) {
                resultsModal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
        });
        
        // Prevent copying from target data area
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && e.key === 'c') {
                if (document.activeElement.closest('.target-data')) {
                    e.preventDefault();
                    alert('Copying is not allowed! Please type the data manually.');
                }
            }
            
            // Close modal with Escape key
            if (e.key === 'Escape' && resultsModal.style.display === 'flex') {
                resultsModal.style.display = 'none';
                document.body.style.overflow = 'auto';
            }
            
            // Submit with Enter key
            if (e.key === 'Enter' && !resultsModal.style.display === 'flex') {
                checkBtn.click();
            }
        });
        
        // Auto-focus on name input when page loads
        window.addEventListener('load', function() {
            nameInput.focus();
        });
    </script>
</body>
</html>
