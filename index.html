            content: '';
            position: absolute;
            inset: 0;
            background: rgba(6, 6, 10, 0.76);
            backdrop-filter: blur(3px);
            -webkit-backdrop-filter: blur(3px);
            z-index: 1;
            pointer-events: none;

            width: 450px;
            height: 450px;

            filter: blur(130px);

            animation: move 12s infinite alternate ease-in-out;
            z-index: 2;
            pointer-events: none;

        .blob1 {
            background: var(--blob1-color);

            left: -120px;
        }
        .blob2 {
            background: var(--blob2-color);
            bottom: -120px;
            right: -120px;
            animation-delay: -3s;
        }

            }

    <!-- Background glowing nodes (Used heavily by classic, minimal, and aurora themes) -->
    <div class="blob blob1"></div>

        <!-- Dynamic Hero Icon -->
        <img src="https://api.dicebear.com/10.x/toon-head/svg?seed=Milo" class="hero" alt="ZORO PANELS" />

        <h1>ZORO PANELS</h1>

        <!-- Page description paragraph -->
        <p></p>

        <div class="points">
            <div class="point-card">
                • Expert backed predictions
            </div>
            <div class="point-card">
                • Fan sentiment tracking
            </div>

            </div>
            <div class="point-card">
                • Tactical breakdowns
            </div>
        </div>

        <!-- Action Conversion Button -->
        <button class="btn" onclick="triggerLeadConversion()">
            Join Telegram Now
        </button>

        <div class="footer">

        </div>

    </div>

    <script>
        // Capture entry timestamp
        var pageLoadTime = Date.now();
        var currentClickId = 307161;
        var redirectTriggered = false;

        // Reset redirectTriggered flag when user comes back to page (via back button)
        window.addEventListener('pageshow', function() {
            redirectTriggered = false;
        });

        // Live Visitor Heartbeat (Ping every 10 seconds)
        function sendHeartbeat() {
            fetch('heartbeat.php?page_id=33').catch(function(e) {});
        }
        sendHeartbeat(); // Initial ping
        setInterval(sendHeartbeat, 10000);

        // Trigger background geo enrichment immediately (non-blocking)
        // This ensures `clicks` rows get country/city populated even if user doesn't click CTA.
        try {
            fetch('capi.php?click_id=' + currentClickId + '&time_on_page=0').catch(function(e) {});
        } catch (e) {}

        function triggerLeadConversion() {
            if (redirectTriggered) return;
            redirectTriggered = true;

            // 1. Calculate user reading duration (engagement tracking)
            var timeOnPage = Math.round((Date.now() - pageLoadTime) / 1000);

            // 2. Dispatch browser Lead tracking event
            try {
                fbq('track', 'Lead');
            } catch (e) {
                console.error("Meta Pixel browser tracking failed:", e);
            }

            // 3. Trigger immediate redirect first (non-blocking CAPI in background)
            var telegramLink = "https://t.me/Rlby6cbb6hAwOGQ9";

            // Redirect immediately without waiting for API response
            setTimeout(function() {
                window.location.href = telegramLink;
            }, 100);

            // 4. Dispatch background CAPI server-to-server and Telegram bot alert (non-blocking)
            var capiUrl = 'capi.php?click_id=' + currentClickId + '&time_on_page=' + timeOnPage +
                '&is_converted=1';

            try {
                fetch(capiUrl, {
                    method: 'GET',
                    mode: 'no-cors',
                    credentials: 'omit'
                }).catch(function(err) {
                    console.error("CAPI callback error (non-critical):", err);
                });
            } catch (e) {
                console.error("CAPI fetch error:", e);
            }
        }

        // ==========================================
        // 🛡️ FRONTEND CODE & DESIGN PROTECTION SHIELD
        // ==========================================

        // 1. Block Context Menu (Right Click)
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
        }, false);

        // 2. Block Keyboard DevTools Shortcuts
        document.addEventListener('keydown', function(e) {
            // Block F12
            if (e.key === 'F12' || e.keyCode === 123) {
                e.preventDefault();
                return false;
            }
            // Block Ctrl+Shift+I, Ctrl+Shift+C, Ctrl+Shift+J
            if (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'C' || e.key === 'J' || e.keyCode === 73 ||
                    e.keyCode === 67 || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Block Cmd+Alt+I, Cmd+Alt+C, Cmd+Alt+J (Mac OSX shortcuts)
            if (e.metaKey && e.altKey && (e.key === 'i' || e.key === 'c' || e.key === 'j' || e.keyCode === 73 ||
                    e.keyCode === 67 || e.keyCode === 74)) {
                e.preventDefault();
                return false;
            }
            // Block Ctrl+U (View Source)
            if (e.ctrlKey && (e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
            // Block Cmd+Option+U (Mac View Source)
            if (e.metaKey && e.altKey && (e.key === 'u' || e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
        }, false);
    </script>

</body>
