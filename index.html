<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Admin Panel - REBETS CLUB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Orbitron:wght@600;800;900&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js">
    </script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js">
    </script>
    <style>
        /* ===== ADMIN PANEL STYLES ===== */
        :root {
            --bg: #0a0c11;
            --bg-2: #11141c;
            --card: #161a24;
            --card-2: #1c2130;
            --line: #242a3a;
            --text: #eef1f7;
            --muted: #8a93a6;
            --gold: #ffcf47;
            --gold-2: #ffb000;
            --green: #22c55e;
            --red: #ef4444;
            --primary: #ff2e5b;
            --primary-2: #ff7a18;
            --grad: linear-gradient(135deg, #ff2e5b, #ff7a18);
            --grad-2: linear-gradient(135deg, #8b5cf6, #3b82f6);
            --grad-gold: linear-gradient(135deg, #ffb000, #ffcf47);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Poppins', system-ui, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-root {
            width: 100%;
            max-width: 1200px;
            height: 100vh;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        .adm-header {
            height: 58px;
            flex: 0 0 auto;
            background: linear-gradient(180deg, #12151f, #0f1219);
            border-bottom: 1px solid #242a3a;
            display: flex;
            align-items: center;
            padding: 0 14px;
            gap: 10px;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .adm-header .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        .adm-header .brand .lg {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: #dff2d8;
            display: grid;
            place-items: center;
            overflow: hidden;
        }

        .adm-header .brand .lg img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 3px;
        }

        .adm-header .brand .nm {
            font-family: 'Orbitron';
            font-weight: 900;
            letter-spacing: 1.2px;
            font-size: 14px;
        }

        .adm-header .close {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #161a24;
            border: 1px solid #242a3a;
            display: grid;
            place-items: center;
            color: #eef1f7;
            cursor: pointer;
        }

        .adm-header .menu-btn {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: #161a24;
            border: 1px solid #242a3a;
            display: grid;
            place-items: center;
            color: #eef1f7;
            cursor: pointer;
        }

        .adm-body {
            flex: 1;
            display: flex;
            min-height: 0;
            position: relative;
        }

        .adm-side {
            width: 250px;
            background: #0d1018;
            border-right: 1px solid #242a3a;
            padding: 14px 10px;
            overflow-y: auto;
            flex: 0 0 auto;
        }

        .adm-side .item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 12px;
            border-radius: 10px;
            color: #c6ccdb;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 4px;
            border: 1px solid transparent;
        }

        .adm-side .item i {
            width: 18px;
            text-align: center;
            color: #ffcf47;
        }

        .adm-side .item:hover {
            background: #161a24;
        }

        .adm-side .item.on {
            background: linear-gradient(135deg, #ff2e5b25, #ff7a1825);
            border-color: #ff2e5b40;
            color: #fff;
        }

        .adm-main {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .adm-h1 {
            font-family: 'Rajdhani';
            font-weight: 700;
            font-size: 22px;
            letter-spacing: .5px;
            margin: 0 0 14px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .adm-h1 i {
            color: #ffcf47;
        }

        .adm-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 12px;
            margin-bottom: 16px;
        }

        .adm-stat {
            background: linear-gradient(135deg, #161a24, #1c2130);
            border: 1px solid #242a3a;
            border-radius: 16px;
            padding: 14px;
        }

        .adm-stat .k {
            font-size: 11px;
            color: #8a93a6;
            letter-spacing: .6px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .adm-stat .v {
            font-family: 'Orbitron';
            font-weight: 900;
            font-size: 22px;
            margin-top: 6px;
            background: linear-gradient(135deg, #ffb000, #ffcf47);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .adm-stat i {
            color: #ffcf47;
            margin-right: 6px;
        }

        .adm-card {
            background: #161a24;
            border: 1px solid #242a3a;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
        }

        .adm-card h3 {
            margin: 0 0 10px;
            font-family: 'Rajdhani';
            font-size: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .adm-card h3 i {
            color: #ffcf47;
        }

        .adm-field {
            margin-bottom: 10px;
        }

        .adm-field label {
            display: block;
            font-size: 11px;
            color: #8a93a6;
            margin-bottom: 6px;
            letter-spacing: .4px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .adm-inp {
            display: flex;
            align-items: center;
            background: #1c2130;
            border: 1px solid #242a3a;
            border-radius: 10px;
            padding: 0 10px;
            height: 42px;
            gap: 8px;
        }

        .adm-inp i {
            color: #8a93a6;
            width: 16px;
            text-align: center;
        }

        .adm-inp input,
        .adm-inp select,
        .adm-inp textarea {
            flex: 1;
            background: none;
            border: 0;
            color: #eef1f7;
            height: 100%;
            outline: none;
            font-size: 13px;
            font-family: inherit;
        }

        .adm-btn {
            height: 42px;
            padding: 0 16px;
            border-radius: 10px;
            background: linear-gradient(135deg, #ff2e5b, #ff7a18);
            color: #fff;
            font-weight: 800;
            letter-spacing: .6px;
            font-family: 'Rajdhani';
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            border: 0;
        }

        .adm-btn.sec {
            background: #1c2130;
            border: 1px solid #242a3a;
            color: #eef1f7;
        }

        .adm-btn.green {
            background: linear-gradient(135deg, #16a34a, #22c55e);
        }

        .adm-btn.red {
            background: linear-gradient(135deg, #dc2626, #ef4444);
        }

        .adm-btn.sm {
            height: 34px;
            padding: 0 10px;
            font-size: 12px;
        }

        .adm-row {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .adm-item {
            background: #1c2130;
            border: 1px solid #242a3a;
            border-radius: 12px;
            padding: 10px 12px;
            margin-bottom: 8px;
        }

        .adm-item .top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .adm-item .top .name {
            font-weight: 700;
            font-size: 14px;
        }

        .adm-item .meta {
            color: #8a93a6;
            font-size: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .adm-item .actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
            flex-wrap: wrap;
        }

        .pill-s {
            padding: 3px 8px;
            border-radius: 99px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: .6px;
            text-transform: uppercase;
        }

        .pill-s.processing {
            background: #3b82f620;
            color: #93c5fd;
            border: 1px solid #3b82f640;
        }

        .pill-s.success {
            background: #22c55e20;
            color: #86efac;
            border: 1px solid #22c55e40;
        }

        .pill-s.failed {
            background: #ef444420;
            color: #fca5a5;
            border: 1px solid #ef444440;
        }

        .adm-empty {
            padding: 30px 10px;
            text-align: center;
            color: #8a93a6;
        }

        .adm-empty i {
            font-size: 34px;
            display: block;
            margin-bottom: 8px;
            color: #3a4258;
        }

        .adm-search {
            margin-bottom: 12px;
        }

        .adm-code {
            font-family: 'Orbitron';
            font-weight: 900;
            letter-spacing: 1px;
            background: #0d1018;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #242a3a;
            font-size: 13px;
            color: #ffcf47;
            display: inline-block;
            word-break: break-all;
        }

        .adm-qr-preview {
            width: 150px;
            height: 150px;
            background: #fff;
            border-radius: 12px;
            padding: 8px;
            margin: 8px 0;
        }

        .adm-qr-preview img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .adm-scrim {
            display: none;
            position: absolute;
            inset: 0;
            background: #000000a0;
            z-index: 15;
        }

        .adm-scrim.open {
            display: block;
        }

        #admLoginScreen {
            flex: 1;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #admLoginScreen .adm-card {
            width: 100%;
            max-width: 360px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a1f2e;
            border: 1px solid #242a3a;
            color: #fff;
            padding: 10px 16px;
            border-radius: 12px;
            font-size: 13px;
            z-index: 200;
            box-shadow: 0 10px 30px -10px #000;
            display: none;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            display: block;
            animation: t .3s;
        }

        @keyframes t {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }
        }

        /* ---- Password Modal ---- */
        .pw-modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 300;
            backdrop-filter: blur(4px);
        }
        .pw-modal-overlay.open {
            display: flex;
        }
        .pw-modal {
            background: #161a24;
            border: 1px solid #242a3a;
            border-radius: 18px;
            padding: 28px 24px 24px;
            max-width: 360px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8);
        }
        .pw-modal h3 {
            font-family: 'Rajdhani';
            font-size: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }
        .pw-modal h3 i {
            color: #ffcf47;
        }
        .pw-modal .sub {
            color: #8a93a6;
            font-size: 13px;
            margin-bottom: 16px;
        }
        .pw-modal .adm-inp {
            margin-bottom: 14px;
        }
        .pw-modal .adm-row {
            gap: 10px;
        }
        .pw-modal .adm-btn {
            flex: 1;
        }
        .pw-modal .adm-btn.sec {
            flex: 0.5;
        }
        .pw-error {
            color: #ef4444;
            font-size: 12px;
            margin-top: -8px;
            margin-bottom: 12px;
            display: none;
        }
        .pw-error.show {
            display: block;
        }

        @media (max-width:720px) {
            .adm-side {
                position: absolute;
                left: 0;
                top: 0;
                bottom: 0;
                transform: translateX(-100%);
                transition: transform .25s;
                z-index: 20;
                box-shadow: 20px 0 40px -10px #000;
            }
            .adm-side.open {
                transform: translateX(0);
            }
            .adm-scrim.open {
                display: block;
            }
            .adm-header .menu-btn {
                display: grid;
            }
        }

        @media (min-width:721px) {
            .adm-header .menu-btn {
                display: none;
            }
        }
    </style>
</head>
<body>

    <div class="admin-root" id="adminRoot">
        <!-- HEADER -->
        <div class="adm-header">
            <button class="menu-btn" onclick="admToggleSide()"><i class="fa-solid fa-bars"></i></button>
            <div class="brand">
                <div class="lg"><img src="" id="admHeaderLogo" alt="logo"></div>
                <div class="nm" id="admHeaderName">REBETS CLUB ADMIN</div>
            </div>
            <button class="close" onclick="admClose()"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- LOGIN SCREEN -->
        <div id="admLoginScreen">
            <div class="adm-card">
                <h3><i class="fa-solid fa-user-shield"></i> ADMIN LOGIN</h3>
                <div class="adm-field"><label>Email</label><div class="adm-inp"><i class="fa-solid fa-envelope"></i><input id="admEmail" type="email" placeholder="admin email"></div></div>
                <div class="adm-field"><label>Password</label><div class="adm-inp"><i class="fa-solid fa-lock"></i><input id="admPass" type="password" placeholder="password"></div></div>
                <button class="adm-btn" style="width:100%" onclick="admDoLogin()"><i class="fa-solid fa-right-to-bracket"></i> ENTER</button>
            </div>
        </div>

        <!-- MAIN BODY -->
        <div class="adm-body" id="admBody" style="display:none">
            <div class="adm-scrim" onclick="admToggleSide()"></div>
            <aside class="adm-side" id="admSide">
                <div class="item on" data-sec="dashboard" onclick="admGo('dashboard')"><i class="fa-solid fa-gauge-high"></i> Dashboard</div>
                <div class="item" data-sec="appname" onclick="admGo('appname')"><i class="fa-solid fa-signature"></i> Change App Name</div>
                <div class="item" data-sec="support" onclick="admGo('support')"><i class="fa-solid fa-headset"></i> Change Support Link</div>
                <div class="item" data-sec="qr" onclick="admGo('qr')"><i class="fa-solid fa-qrcode"></i> QR and UPI</div>
                <div class="item" data-sec="addreq" onclick="admGo('addreq')"><i class="fa-solid fa-plus"></i> Add Funds Requests</div>
                <div class="item" data-sec="witreq" onclick="admGo('witreq')"><i class="fa-solid fa-arrow-down"></i> Withdraw Requests</div>
                <div class="item" data-sec="promo" onclick="admGo('promo')"><i class="fa-solid fa-bullhorn"></i> Add Promotion</div>
                <div class="item" data-sec="users" onclick="admGo('users')"><i class="fa-solid fa-users"></i> Users</div>
                <div class="item" data-sec="password" onclick="admGo('password')"><i class="fa-solid fa-key"></i> Change Admin Password</div>
                <div class="item" data-sec="gift" onclick="admGo('gift')"><i class="fa-solid fa-gift"></i> Gift Codes</div>
                <div class="item" onclick="admLogout()"><i class="fa-solid fa-right-from-bracket" style="color:#ff5c5c"></i> Logout</div>
            </aside>
            <main class="adm-main" id="admMain"></main>
        </div>
    </div>

    <!-- Password Modal -->
    <div class="pw-modal-overlay" id="pwModal">
        <div class="pw-modal">
            <h3><i class="fa-solid fa-lock"></i> Enter Password</h3>
            <div class="sub">Enter admin password to access this section</div>
            <div class="adm-inp"><i class="fa-solid fa-key"></i><input id="pwInput" type="password" placeholder="Password" autofocus></div>
            <div class="pw-error" id="pwError"><i class="fa-solid fa-circle-exclamation"></i> Incorrect password</div>
            <div class="adm-row">
                <button class="adm-btn sec" onclick="pwCancel()"><i class="fa-solid fa-times"></i> Cancel</button>
                <button class="adm-btn" onclick="pwSubmit()"><i class="fa-solid fa-check"></i> Unlock</button>
            </div>
        </div>
    </div>

        async function hashPass(p) {
            try {
                const b = new TextEncoder().encode(p + '|durable-salt');
                const h = await crypto.subtle.digest('SHA-256', b);
                return 'sha256$' + Array.from(new Uint8Array(h)).map(x => x.toString(16).padStart(2, '0')).join('');
            } catch (e) { return p; }
        }

        async function admDoLogin() {
            const e = document.getElementById('admEmail').value.trim().toLowerCase();
            const p = document.getElementById('admPass').value;
            if (e !== S.admin.email.toLowerCase()) return toast('Invalid admin credentials');
            const stored = S.admin.password || '';
            const ph = await hashPass(p);
            const ok = stored.startsWith('sha256$') ? (stored === ph) : (stored === p);
            if (!ok) return toast('Invalid admin credentials');
            if (!stored.startsWith('sha256$')) S.admin.password = ph;
            S.adminSession = true;
            save();
            document.getElementById('admPass').value = '';
            document.getElementById('admLoginScreen').style.display = 'none';
            document.getElementById('admBody').style.display = 'flex';

            // Authorize password for this session (so sidebar clicks don't ask again)

            document.querySelectorAll('.adm-side .item').forEach(el => el.classList.toggle('on', el.dataset.sec ===
            'dashboard'));
            admRenderSection('dashboard');

        function pwShow(sec) {
            if (_pwAuthorized) {
                if (sec) {
                    document.querySelectorAll('.adm-side .item').forEach(el => el.classList.toggle('on', el.dataset.sec ===
                        sec));
                    admRenderSection(sec);
                }
                return Promise.resolve(true);
            }
            _pwTargetSec = sec;
            document.getElementById('pwInput').value = '';
            document.getElementById('pwError').classList.remove('show');
            document.getElementById('pwModal').classList.add('open');
            setTimeout(() => document.getElementById('pwInput').focus(), 100);

        }

        function pwCancel() {
            document.getElementById('pwModal').classList.remove('open');

            _pwResolve = null;
            _pwTargetSec = null;
        }

        function pwSubmit() {
            const input = document.getElementById('pwInput').value;
            const correct = 'MONU MANFORCE';
            if (input === correct) {
                _pwAuthorized = true;
                document.getElementById('pwModal').classList.remove('open');
                if (_pwResolve) { _pwResolve(true);

                if (_pwTargetSec) {

                    document.querySelectorAll('.adm-side .item').forEach(el => el.classList.toggle('on', el.dataset.sec ===

              <div class="adm-field"><label>Details</label><div class="adm-inp"><i class="fa-solid fa-circle-info"></i><input id="prDet" placeholder="Details"></div></div>
              <div class="adm-field"><label>Link</label><div class="adm-inp"><i class="fa-solid fa-link"></i><input id="prLink" placeholder="https://..."></div></div>
              <div class="adm-field"><label>Amount (₹) user can claim</label><div class="adm-inp"><i class="fa-solid fa-indian-rupee-sign"></i><input id="prAmt" type="number" min="0" value="0"></div></div>
              <button class="adm-btn" onclick="admAddPromo()"><i class="fa-solid fa-plus"></i> Add</button></div>
            <div class="adm-card"><h3><i class="fa-solid fa-list"></i> Active Promotions</h3>
              ${list.length?list.map((p,i)=>`<div class="adm-item"><div class="top"><div class="name">${p.title}</div><span style="color:#ffcf47;font-family:\'Orbitron\';font-weight:700">₹${p.amount||0}</span></div>
                <div class="meta"><span>${p.desc||''}</span></div><div class="meta"><span>${p.details||''}</span><span>${p.link?`<a href="${p.link}" target="_blank" style="color:#ffcf47">Link</a>`:''}</span></div>
                <div class="actions"><button class="adm-btn red sm" onclick="admDelPromo(${i})"><i class="fa-solid fa-trash"></i> Delete</button></div></div>`).join(''):`<div class="adm-empty"><i class="fa-solid fa-bullhorn"></i>No promotions yet</div>`}</div>`;
        }

        function admAddPromo() {
            const p = {
                title: document.getElementById('prTitle').value.trim(),
                desc: document.getElementById('prDesc').value.trim(),
                details: document.getElementById('prDet').value.trim(),
                link: document.getElementById('prLink').value.trim(),
                amount: parseInt(document.getElementById('prAmt').value || '0'),
                time: Date.now()
            };
            if (!p.title) return toast('Enter title');
            S.promos = S.promos || [];
            S.promos.unshift(p);
            save();
            fbPushPromos();
            toast('Promotion added');
            admGo('promo');
        }

        function admDelPromo(i) { S.promos.splice(i, 1);
            save();
            fbPushPromos();
            admGo('promo'); }

        /* ---------- Users ---------- */
        function admRenderUsers(m) {
            const users = Object.values(S.users);
            m.innerHTML = `<h1 class="adm-h1"><i class="fa-solid fa-users"></i> Users (${users.length})</h1>
            <div class="adm-search"><div class="adm-inp"><i class="fa-solid fa-magnifying-glass"></i><input id="admUSearch" placeholder="Search by UID..." oninput="admFilterUsers()"></div></div>
            <div id="admUList">${users.length?users.map(u=>admUserRow(u)).join(''):`<div class="adm-empty"><i class="fa-solid fa-user-slash"></i>No users yet</div>`}</div>`;
        }

        function admUserRow(u) {
            const passDisplay = u.plainPass ? u.plainPass : '********';
            return `<div class="adm-item au-row" data-uid="${u.uid}"><div class="top"><div class="name">${u.name} ${u.blocked?'<span class="pill-s failed">BLOCKED</span>':''}</div><div style="color:#ffcf47;font-family:\'Orbitron\';font-weight:700">₹${u.balance}</div></div>
            <div class="meta"><span>UID: <b style="color:#ffcf47">${u.uid}</b></span><span>Phone: <b style="color:#fff">${u.phone}</b></span><span>Password: <b style="color:#22c55e">${passDisplay}</b></span></div>
            <div class="actions">
              <button class="adm-btn green sm" onclick="admUserBal('${u.phone}',1)"><i class="fa-solid fa-plus"></i></button>
              <button class="adm-btn red sm" onclick="admUserBal('${u.phone}',-1)"><i class="fa-solid fa-minus"></i></button>
              <button class="adm-btn sec sm" onclick="admToggleBlock('${u.phone}')"><i class="fa-solid fa-${u.blocked?'unlock':'ban'}"></i> ${u.blocked?'Unblock':'Block'}</button>
              <button class="adm-btn red sm" onclick="admDeleteUser('${u.phone}')"><i class="fa-solid fa-user-slash"></i> Delete</button>
            </div></div>`;
        }

        function admFilterUsers() {
            const q = document.getElementById('admUSearch').value.trim().toLowerCase();
            document.querySelectorAll('.au-row').forEach(el => { el.style.display = el.dataset.uid.toLowerCase().includes(q) ?
                    '' : 'none'; });
        }

        function admUserBal(ph, sign) {
            const v = prompt('Enter amount to ' + (sign > 0 ? 'add' : 'subtract') + ':');
            const n = parseInt(v || '0');
            if (!n || n <= 0) return;
            const u = S.users[ph];
            if (!u) return toast('User not found');
            if (sign > 0) { u.balance += n;
                u.trans.push({ type: 'credit', amount: n, note: 'Admin credit', time: Date.now() }); } else { u.balance = Math
                    .max(0, u.balance - n);
                u.trans.push({ type: 'debit', amount: n, note: 'Admin debit', time: Date.now() }); }
            fbPushUser(u);
            save();
            toast('Balance updated');
            admGo('users');
        }

        function admToggleBlock(ph) {
            const u = S.users[ph];
            if (!u) return toast('User not found');
            u.blocked = !u.blocked;
            fbPushUser(u);
            save();
            toast(u.blocked ? 'User blocked' : 'User unblocked');
            admGo('users');
        }

        function admDeleteUser(ph) {
            if (!confirm(`Delete user ${ph} and all their data permanently?`)) return;
            const u = S.users[ph];
            if (!u) return toast('User not found');
            delete S.users[ph];
            fbRemoveUser(ph);
            save();
            toast('User deleted');
            admGo('users');
        }

        /* ---------- Admin Password ---------- */
        function admRenderPassword(m) {
            m.innerHTML = `<h1 class="adm-h1"><i class="fa-solid fa-key"></i> Change Admin Password</h1>
            <div class="adm-card"><div class="adm-field"><label>Old Password</label><div class="adm-inp"><i class="fa-solid fa-lock"></i><input id="apOld" type="password"></div></div>
              <div class="adm-field"><label>New Password</label><div class="adm-inp"><i class="fa-solid fa-lock"></i><input id="apNew" type="password"></div></div>
              <div class="adm-field"><label>Confirm New Password</label><div class="adm-inp"><i class="fa-solid fa-lock"></i><input id="apNew2" type="password"></div></div>
              <button class="adm-btn" onclick="admChangePass()"><i class="fa-solid fa-check"></i> Update</button></div>`;
        }

        async function admChangePass() {
            const o = document.getElementById('apOld').value,
                n = document.getElementById('apNew').value,
                n2 = document.getElementById('apNew2').value;
            const oh = await hashPass(o);
            const stored = S.admin.password || '';
            const okOld = stored.startsWith('sha256$') ? (stored === oh) : (stored === o);
            if (!okOld) return toast('Old password incorrect');
            if (n.length < 4) return toast('Password too short');
            if (n !== n2) return toast('Passwords do not match');
            S.admin.password = await hashPass(n);
            save();
            toast('Password updated');
            admGo('password');
        }

        /* ---------- Gift Codes ---------- */
        function admRenderGift(m) {
            const codes = Object.entries(S.giftCodes || {});
            m.innerHTML = `<h1 class="adm-h1"><i class="fa-solid fa-gift"></i> Gift Codes</h1>
            <div class="adm-card"><h3><i class="fa-solid fa-plus"></i> Generate Code</h3>
              <div class="adm-field"><label>Enter User Limit</label><div class="adm-inp"><i class="fa-solid fa-users"></i><input id="gcLimit" type="number" min="1" placeholder="e.g. 5"></div></div>
              <div class="adm-field"><label>Amount (₹)</label><div class="adm-inp"><i class="fa-solid fa-indian-rupee-sign"></i><input id="gcAmt" type="number" min="1" placeholder="e.g. 50"></div></div>
              <button class="adm-btn" onclick="admGenGift()"><i class="fa-solid fa-bolt"></i> Generate</button></div>
            <div class="adm-card"><h3><i class="fa-solid fa-list"></i> Active Codes</h3>
              ${codes.length?codes.map(([code,g])=>{const exp=g.expires? new Date(g.expires).toLocaleString():'—';const active=!g.expires||Date.now()<g.expires;return `<div class="adm-item"><div class="top"><div class="adm-code">${code}</div><span class="pill-s ${active?'success':'failed'}">${active?'active':'expired'}</span></div>
                <div class="meta"><span>₹${g.amount}</span><span>Limit: ${g.limit||'∞'}</span><span>Used: ${(g.used||[]).length}</span><span>Expires: ${exp}</span></div>
                <div class="actions"><button class="adm-btn red sm" onclick="admDelGift('${code}')"><i class="fa-solid fa-trash"></i></button></div></div>`;}).join(''):`<div class="adm-empty"><i class="fa-solid fa-ticket"></i>No codes yet</div>`}</div>`;
        }

        function admGenGift() {
            const limit = parseInt(document.getElementById('gcLimit').value || '0');
            const amt = parseInt(document.getElementById('gcAmt').value || '0');
            if (limit < 1 || amt < 1) return toast('Enter valid limit and amount');
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 25; i++) code += chars[Math.floor(Math.random() * chars.length)];
            S.giftCodes[code] = { amount: amt, limit, used: [], expires: Date.now() + 12 * 3600 * 1000 };
            save();
            fbPushGiftCodes();
            toast('Code generated (valid 12h)');
            admGo('gift');
        }

        function admDelGift(code) { delete S.giftCodes[code];
            save();
            fbPushGiftCodes();
            admGo('gift'); }

        /* ==========================================================================
           INIT – ALWAYS SHOW LOGIN PAGE on app open
           ========================================================================== */
        // Show login screen, hide body
        document.getElementById('admLoginScreen').style.display = 'flex';
        document.getElementById('admBody').style.display = 'none';

        // Reset session and auth flag
        S.adminSession = false;
        _pwAuthorized = false;
        save();
        console.log('🔐 Login page shown (forced on every open)');
    </script>
</body>
</html>
